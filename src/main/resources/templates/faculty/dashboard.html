<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Portal - CampusFlow</title>
    <!-- Modern Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --secondary: #f8f9fa;
            --dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--text-main); }
        .navbar-custom { background-color: var(--primary); padding: 15px 0; box-shadow: 0 4px 12px rgba(16,185,129,0.15); }
        .navbar-brand { font-weight: 700; color: white !important; font-size: 1.25rem; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); transition: transform 0.2s; }
        .btn-custom { border-radius: 10px; padding: 12px 20px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 120px; transition: 0.3s; }
        .btn-custom i { font-size: 2rem; margin-bottom: 12px; }
        .btn-custom:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .user-header { background: linear-gradient(135deg, var(--primary), #047857); color: white; border-radius: 16px; padding: 40px; position: relative; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(16,185,129,0.2); }
        .user-header::after { content: ''; position: absolute; right: -5%; top: -50%; width: 300px; height: 300px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    </style>
    <link rel="stylesheet" th:href="@{/css/campusflow-theme.css}">
    <script>
        (() => {
            const selected = localStorage.getItem('campusflow-theme') || 'system';
            const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = selected === 'system' ? (dark ? 'dark' : 'light') : selected;
        })();
    </script>
    <script th:src="@{/js/campusflow-theme.js}" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill me-2"></i> CampusFlow</a>
            <div class="ms-auto d-flex align-items-center">
                <label for="theme-selector" class="visually-hidden">Color theme</label>
                <select id="theme-selector" class="form-select form-select-sm theme-control me-3" aria-label="Color theme">
                    <option value="light">Light</option><option value="dark">Dark</option>
                    <option value="pastel">Soft Pastel</option><option value="system">System</option>
                </select>
                <span class="text-white me-4 fw-medium"><i class="bi bi-person-circle me-1"></i> <span th:text="${user.firstName + ' ' + user.lastName}">Faculty</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-light text-success fw-semibold rounded-pill px-3 py-2">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="user-header">
            <h1 class="fw-bold mb-2">Welcome, <span th:text="${user.firstName}">Professor</span>! 👋</h1>
            <p class="fs-5 opacity-75 mb-0">Manage your classes, students, and resources efficiently.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <a th:href="@{/faculty/attendance}" class="btn btn-light w-100 btn-custom text-success border text-decoration-none">
                    <i class="bi bi-calendar2-check-fill"></i>
                    <span>Manage Attendance</span>
                </a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/faculty/assignments}" class="btn btn-light w-100 btn-custom text-primary border text-decoration-none">
                    <i class="bi bi-journal-code"></i>
                    <span>Assignments & Grading</span>
                </a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/faculty/materials}" class="btn btn-light w-100 btn-custom text-info border text-decoration-none">
                    <i class="bi bi-cloud-arrow-up-fill"></i>
                    <span>Study Materials</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
