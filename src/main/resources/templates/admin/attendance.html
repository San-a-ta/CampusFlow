<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Attendance')}">
</head>
<body>
    <div class="wrapper">
        <div th:replace="~{admin/fragments :: sidebar('attendance')}"></div>

        <div class="main-panel">
            <div th:replace="~{admin/fragments :: navbar('Attendance')}"></div>

            <div class="content-padding">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="page-title">Attendance</h2>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/admin/attendance}" method="get" class="row g-3 align-items-end">
                            <div class="col-lg-4 col-md-6">
                                <label for="attendanceDepartmentFilter" class="form-label fw-semibold">Department</label>
                                <select id="attendanceDepartmentFilter" name="departmentId" class="form-select">
                                    <option value="">All departments</option>
                                    <option th:each="department : ${departments}" th:value="${department.id}"
                                            th:selected="${selectedDepartmentId != null and selectedDepartmentId == department.id}"
                                            th:text="${department.name}"></option>
                                </select>
                            </div>
                            <div class="col-lg-3 col-md-6 d-flex gap-2">
                                <button type="submit" class="btn btn-outline-primary flex-grow-1"><i class="bi bi-funnel me-1"></i>Apply</button>
                                <a th:href="@{/admin/attendance}" class="btn btn-light border">Clear</a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Attendance</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Branch / Department</th>
                                        <th>Roll Number</th>
                                        <th>Attendance Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="record : ${attendanceList}">
                                        <td class="fw-semibold text-dark"
                                            th:text="${record.student.firstName + ' ' + record.student.lastName}">Student Name</td>
                                        <td th:text="${record.student.department != null ? record.student.department.name : 'Unassigned'}">Department</td>
                                        <td th:text="${record.student.id}">1</td>
                                        <td>
                                            <span class="badge"
                                                  th:text="${record.status}"
                                                  th:classappend="${record.status.name() == 'PRESENT'} ? 'badge-soft-success' : (${record.status.name() == 'ABSENT'} ? 'badge-soft-danger' : (${record.status.name() == 'LATE'} ? 'badge-soft-warning' : 'badge-soft-info'))">
                                                PRESENT
                                            </span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(attendanceList)}">
                                        <td colspan="4" class="text-center py-5 text-muted">No attendance records found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
