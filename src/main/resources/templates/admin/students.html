<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Students')}">
</head>
<body>
    <div class="wrapper">
        <div th:replace="~{admin/fragments :: sidebar('students')}"></div>
        
        <div class="main-panel">
            <div th:replace="~{admin/fragments :: navbar('Students Management')}"></div>

            <div class="content-padding">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="page-title">Students</h2>
                        <p class="text-muted mb-0">Manage and view all enrolled students</p>
                    </div>
                    <div>
                        <button class="btn btn-light border shadow-sm me-2"><i class="bi bi-filter me-1"></i> Filter</button>
                        <button class="btn btn-primary shadow-sm"><i class="bi bi-person-plus-fill me-1"></i> Add Student</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th style="padding-left: 24px; width: 60px;">ID</th>
                                        <th>Student Name</th>
                                        <th>Email Address</th>
                                        <th>Department</th>
                                        <th>Sem</th>
                                        <th class="text-end" style="padding-right: 24px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="student : ${students}">
                                        <td style="padding-left: 24px;" class="text-muted fw-medium" th:text="${'#' + student.id}">#1</td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="user-avatar me-3 shadow-sm" style="width: 40px; height: 40px; font-size: 0.85rem;" th:text="${#strings.substring(student.firstName,0,1) + #strings.substring(student.lastName,0,1)}">JD</div>
                                                <div>
                                                    <div class="fw-semibold text-dark" th:text="${student.firstName + ' ' + student.lastName}">John Doe</div>
                                                    <small class="text-muted">Enrolled 2023</small>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-muted" th:text="${student.email}">student@campusflow.com</td>
                                        <td>
                                            <span class="badge badge-soft-info" th:if="${student.department != null}">
                                                <i class="bi bi-building me-1"></i> <span th:text="${student.department.name}">CS</span>
                                            </span>
                                            <span class="text-muted small" th:if="${student.department == null}">Not Assigned</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-light text-dark border" th:text="${'Sem ' + student.currentSemester}">Sem 1</span>
                                        </td>
                                        <td class="text-end" style="padding-right: 24px;">
                                            <button class="btn btn-light btn-action text-primary me-1" title="Edit"><i class="bi bi-pencil-square"></i></button>
                                            <button class="btn btn-light btn-action text-danger" title="Delete"><i class="bi bi-trash3"></i></button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(students)}">
                                        <td colspan="6" class="text-center py-5">
                                            <div class="text-muted">
                                                <i class="bi bi-people fs-1 d-block mb-3 opacity-50"></i>
                                                <h5 class="fw-semibold">No students found</h5>
                                                <p class="mb-0">Get started by adding a new student to the system.</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top px-4 py-3 d-flex justify-content-between align-items-center" th:if="${not #lists.isEmpty(students)}">
                        <span class="text-muted small" th:text="${'Showing ' + students.size() + ' results'}">Showing 10 results</span>
                        <nav aria-label="Page navigation">
                            <ul class="pagination pagination-sm m-0">
                                <li class="page-item disabled"><a class="page-link border-0" href="#">Previous</a></li>
                                <li class="page-item active"><a class="page-link border-0 rounded" href="#">1</a></li>
                                <li class="page-item"><a class="page-link border-0 text-dark" href="#">Next</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
