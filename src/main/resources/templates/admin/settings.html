<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Settings')}">
</head>
<body>
    <div class="wrapper">
        <div th:replace="~{admin/fragments :: sidebar('settings')}"></div>
        
        <div class="main-panel">
            <div th:replace="~{admin/fragments :: navbar('Platform Settings')}"></div>

            <div class="content-padding">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="page-title">Settings</h2>
                        <p class="text-muted mb-0">Configure your institution's core preferences</p>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-lg-3 mb-4 mb-lg-0">
                        <div class="card border-0 shadow-sm">
                            <div class="list-group list-group-flush rounded-3 border-0">
                                <a href="#" class="list-group-item list-group-item-action border-0 active bg-primary text-white py-3 fw-medium">
                                    <i class="bi bi-building me-2"></i> General Info
                                </a>
                                <a href="#" class="list-group-item list-group-item-action border-0 py-3 text-muted fw-medium">
                                    <i class="bi bi-shield-lock me-2"></i> Security
                                </a>
                                <a href="#" class="list-group-item list-group-item-action border-0 py-3 text-muted fw-medium">
                                    <i class="bi bi-bell me-2"></i> Notifications
                                </a>
                                <a href="#" class="list-group-item list-group-item-action border-0 py-3 text-muted fw-medium">
                                    <i class="bi bi-cloud-arrow-up me-2"></i> Data Backups
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-9">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header pb-0 border-0 pt-4 bg-transparent px-4">
                                <h5 class="fw-bold mb-0 text-dark">General Information</h5>
                                <p class="text-muted small mt-1">Update your college details and branding.</p>
                                <hr>
                            </div>
                            <div class="card-body px-4 pt-2">
                                <form>
                                    <div class="row mb-4">
                                        <div class="col-md-3 text-md-end pt-2 fw-medium text-dark">Institution Name</div>
                                        <div class="col-md-7">
                                            <input type="text" class="form-control bg-light" value="CampusFlow Institute of Technology">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-4">
                                        <div class="col-md-3 text-md-end pt-2 fw-medium text-dark">System Email</div>
                                        <div class="col-md-7">
                                            <input type="email" class="form-control bg-light" value="admin@campusflow.com">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-4">
                                        <div class="col-md-3 text-md-end pt-2 fw-medium text-dark">Academic Year</div>
                                        <div class="col-md-4">
                                            <select class="form-select bg-light">
                                                <option>2022 - 2023</option>
                                                <option selected>2023 - 2024</option>
                                                <option>2024 - 2025</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-4">
                                        <div class="col-md-3 text-md-end pt-1 fw-medium text-dark">Platform Theme</div>
                                        <div class="col-md-7">
                                            <div class="d-flex gap-3">
                                                <div class="form-check border rounded p-3 bg-light" style="width: 120px;">
                                                    <input class="form-check-input ms-0 mt-0 float-end" type="radio" name="theme" id="themeLight" checked>
                                                    <label class="form-check-label w-100" for="themeLight">
                                                        <i class="bi bi-sun fs-4 d-block text-warning mb-2"></i>
                                                        <span class="fw-medium">Light</span>
                                                    </label>
                                                </div>
                                                <div class="form-check border rounded p-3 bg-white" style="width: 120px;">
                                                    <input class="form-check-input ms-0 mt-0 float-end" type="radio" name="theme" id="themeDark">
                                                    <label class="form-check-label w-100" for="themeDark">
                                                        <i class="bi bi-moon-stars fs-4 d-block text-dark mb-2"></i>
                                                        <span class="fw-medium text-muted">Dark</span>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row mt-5">
                                        <div class="col-md-7 offset-md-3">
                                            <button type="button" class="btn btn-primary px-4 fw-medium shadow-sm">Save Changes</button>
                                            <button type="button" class="btn btn-light ms-2 border fw-medium">Cancel</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
