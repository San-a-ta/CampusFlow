<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Departments')}">
</head>
<body>
    <div class="wrapper">
        <div th:replace="~{admin/fragments :: sidebar('departments')}"></div>
        
        <div class="main-panel">
            <div th:replace="~{admin/fragments :: navbar('Departments')}"></div>

            <div class="content-padding">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="page-title">Departments</h2>
                        <p class="text-muted mb-0">Manage institutional departments and programs</p>
                    </div>
                    <div>
                        <button class="btn btn-warning shadow-sm text-white border-0"><i class="bi bi-plus-lg me-1"></i> Add Department</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th style="padding-left: 24px; width: 60px;">ID</th>
                                        <th style="width: 150px;">Code</th>
                                        <th>Department Name</th>
                                        <th class="text-end" style="padding-right: 24px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="dept : ${departments}">
                                        <td style="padding-left: 24px;" class="text-muted fw-medium" th:text="${'#' + dept.id}">#1</td>
                                        <td>
                                            <span class="badge badge-soft-warning px-3 py-2 fw-bold" th:text="${dept.code}">CS</span>
                                        </td>
                                        <td>
                                            <div class="fw-semibold text-dark fs-6" th:text="${dept.name}">Computer Science</div>
                                        </td>
                                        <td class="text-end" style="padding-right: 24px;">
                                            <button class="btn btn-light btn-action text-primary me-1" title="Edit"><i class="bi bi-pencil-square"></i></button>
                                            <button class="btn btn-light btn-action text-danger" title="Delete"><i class="bi bi-trash3"></i></button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(departments)}">
                                        <td colspan="4" class="text-center py-5">
                                            <div class="text-muted">
                                                <i class="bi bi-building fs-1 d-block mb-3 opacity-50"></i>
                                                <h5 class="fw-semibold">No departments found</h5>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
