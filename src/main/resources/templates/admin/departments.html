<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Departments')}">
</head>
<body>
    <div class="wrapper">
        <div th:replace="~{admin/fragments :: sidebar('departments')}"></div>
        
        <div class="main-panel">
            <div th:replace="~{admin/fragments :: navbar('Departments')}"></div>

            <div class="content-padding">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="page-title">Departments</h2>
                        <p class="text-muted mb-0">
                            Manage institutional departments and programs
                            <span class="badge bg-light text-dark border ms-2" th:text="${departmentCount + ' total'}">0 total</span>
                        </p>
                    </div>
                    <button class="btn btn-warning shadow-sm text-white border-0" data-bs-toggle="modal" data-bs-target="#departmentModal">
                        <i class="bi bi-plus-lg me-1"></i> Add Department
                    </button>
                </div>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 border-0 shadow-sm" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Success</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 border-0 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <form th:action="@{/admin/departments}" method="get" class="row g-2 align-items-end">
                            <div class="col-md-9">
                                <label for="departmentSearch" class="form-label small fw-semibold mb-1">Search departments</label>
                                <input id="departmentSearch" type="search" name="search" class="form-control"
                                       placeholder="Department name or code" th:value="${search}" />
                            </div>
                            <div class="col-md-3 d-flex gap-2">
                                <button class="btn btn-outline-primary flex-grow-1" type="submit">
                                    <i class="bi bi-search"></i> Search
                                </button>
                                <a class="btn btn-light border" th:href="@{/admin/departments}">Clear</a>
                            </div>
                        </form>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th style="padding-left: 24px; width: 60px;">ID</th>
                                        <th style="width: 150px;">Code</th>
                                        <th>Department Name</th>
                                        <th class="text-end" style="padding-right: 24px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="dept : ${departments}">
                                        <td style="padding-left: 24px;" class="text-muted fw-medium" th:text="${'#' + dept.id}">#1</td>
                                        <td>
                                            <span class="badge badge-soft-warning px-3 py-2 fw-bold" th:text="${dept.code}">CS</span>
                                        </td>
                                        <td>
                                            <div class="fw-semibold text-dark fs-6" th:text="${dept.name}">Computer Science</div>
                                        </td>
                                        <td class="text-end" style="padding-right: 24px;">
                                            <button type="button" class="btn btn-light btn-action text-primary me-1" title="Edit"
                                                    th:attr="data-id=${dept.id},data-name=${dept.name},data-code=${dept.code}"
                                                    onclick="populateDepartmentForm(this)"><i class="bi bi-pencil-square"></i></button>
                                            <form th:action="@{/admin/departments/delete}" method="post" class="d-inline">
                                                <input type="hidden" name="id" th:value="${dept.id}" />
                                                <button type="submit" class="btn btn-light btn-action text-danger" title="Delete"
                                                        onclick="return confirm('Delete this department?')"><i class="bi bi-trash3"></i></button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(departments)}">
                                        <td colspan="4" class="text-center py-5">
                                            <div class="text-muted">
                                                <i class="bi bi-building fs-1 d-block mb-3 opacity-50"></i>
                                                <h5 class="fw-semibold">No departments found</h5>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-footer bg-white border-top px-4 py-3">
                            <span class="text-muted small" th:text="${'Showing ' + departments.size() + ' departments'}">Showing departments</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="departmentModal" tabindex="-1" aria-labelledby="departmentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <form th:action="@{/admin/departments/save}" method="post">
                    <div class="modal-header border-0 pb-0 px-4 pt-4">
                        <h5 class="modal-title fw-bold" id="departmentModalLabel">Department Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body px-4 py-3">
                        <input type="hidden" id="departmentId" name="id" />
                        <div class="mb-3">
                            <label for="departmentName" class="form-label fw-semibold">Department name</label>
                            <select id="departmentName" name="name" class="form-select" required>
                                <option value="">Select department</option>
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="IT">IT</option>
                                <option value="AIML">AIML</option>
                                <option th:each="existing : ${departmentOptions}"
                                        th:if="${existing.name != 'CSE' and existing.name != 'ECE' and existing.name != 'IT' and existing.name != 'AIML'}"
                                        th:value="${existing.name}" th:text="${existing.name}"></option>
                            </select>
                        </div>
                        <div>
                            <label for="departmentCode" class="form-label fw-semibold">Department code</label>
                            <input id="departmentCode" name="code" type="text" class="form-control" maxlength="50"
                                   pattern="[A-Za-z0-9_-]+" required />
                            <div class="form-text">Use letters, numbers, hyphens, or underscores.</div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4 pt-0">
                        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Department</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function populateDepartmentForm(button) {
            document.getElementById('departmentId').value = button.getAttribute('data-id') || '';
            document.getElementById('departmentName').value = button.getAttribute('data-name') || '';
            document.getElementById('departmentCode').value = button.getAttribute('data-code') || '';
            document.getElementById('departmentModalLabel').textContent = 'Edit Department';
            new bootstrap.Modal(document.getElementById('departmentModal')).show();
        }

        document.getElementById('departmentModal').addEventListener('hidden.bs.modal', function () {
            this.querySelector('form').reset();
            document.getElementById('departmentId').value = '';
            document.getElementById('departmentModalLabel').textContent = 'Department Details';
        });
    </script>
</body>
</html>
