<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Faculty')}">
</head>
<body>
    <div class="wrapper">
        <div th:replace="~{admin/fragments :: sidebar('faculty')}"></div>
        
        <div class="main-panel">
            <div th:replace="~{admin/fragments :: navbar('Faculty Management')}"></div>

            <div class="content-padding">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="page-title">Faculty</h2>
                        <p class="text-muted mb-0">Manage teaching staff and professors</p>
                    </div>
                    <div>
                        <button class="btn btn-primary shadow-sm" style="background-color: #10b981; border-color: #10b981;"><i class="bi bi-person-plus-fill me-1"></i> Add Faculty</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th style="padding-left: 24px; width: 60px;">ID</th>
                                        <th>Faculty Name</th>
                                        <th>Email Address</th>
                                        <th>Department</th>
                                        <th class="text-end" style="padding-right: 24px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="faculty : ${facultyList}">
                                        <td style="padding-left: 24px;" class="text-muted fw-medium" th:text="${'#' + faculty.id}">#1</td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="user-avatar me-3 shadow-sm" style="width: 40px; height: 40px; font-size: 0.85rem; background: linear-gradient(135deg, #10b981, #059669);" th:text="${#strings.substring(faculty.firstName,0,1) + #strings.substring(faculty.lastName,0,1)}">JD</div>
                                                <div>
                                                    <div class="fw-semibold text-dark" th:text="${faculty.firstName + ' ' + faculty.lastName}">Jane Smith</div>
                                                    <small class="text-muted">Professor</small>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-muted" th:text="${faculty.email}">faculty@campusflow.com</td>
                                        <td>
                                            <span class="badge badge-soft-primary" th:if="${faculty.department != null}">
                                                <i class="bi bi-diagram-3 me-1"></i> <span th:text="${faculty.department.name}">CS</span>
                                            </span>
                                            <span class="text-muted small" th:if="${faculty.department == null}">Not Assigned</span>
                                        </td>
                                        <td class="text-end" style="padding-right: 24px;">
                                            <button class="btn btn-light btn-action text-primary me-1" title="Edit"><i class="bi bi-pencil-square"></i></button>
                                            <button class="btn btn-light btn-action text-danger" title="Delete"><i class="bi bi-trash3"></i></button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(facultyList)}">
                                        <td colspan="5" class="text-center py-5">
                                            <div class="text-muted">
                                                <i class="bi bi-person-workspace fs-1 d-block mb-3 opacity-50"></i>
                                                <h5 class="fw-semibold">No faculty members found</h5>
                                                <p class="mb-0">Start by onboarding your first faculty member.</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
