<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Portal - CampusFlow</title>
    <!-- Modern Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --secondary: #f8f9fa;
            --dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--text-main); }
        .navbar-custom { background-color: var(--primary); padding: 15px 0; box-shadow: 0 4px 12px rgba(245,158,11,0.15); }
        .navbar-brand { font-weight: 700; color: white !important; font-size: 1.25rem; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); transition: transform 0.2s; }
        .btn-custom { border-radius: 10px; padding: 12px 20px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 120px; transition: 0.3s; }
        .btn-custom i { font-size: 2rem; margin-bottom: 12px; }
        .btn-custom:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .user-header { background: linear-gradient(135deg, var(--primary), #b45309); color: white; border-radius: 16px; padding: 40px; position: relative; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(245,158,11,0.2); }
        .user-header::after { content: ''; position: absolute; right: -5%; top: -50%; width: 300px; height: 300px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill me-2"></i> CampusFlow</a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-4 fw-medium"><i class="bi bi-person-circle me-1"></i> <span th:text="${user.firstName + ' ' + user.lastName}">HOD</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-light text-warning fw-semibold rounded-pill px-3 py-2">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="user-header">
            <h1 class="fw-bold mb-2">Welcome, <span th:text="${user.firstName}">HOD</span>! 👋</h1>
            <p class="fs-5 opacity-75 mb-0">Oversee the <strong class="text-white" th:text="${user.department != null ? user.department.name : 'Department'}">CS</strong> department analytics and operations.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <button class="btn btn-light w-100 btn-custom text-primary border">
                    <i class="bi bi-people-fill"></i>
                    <span>Manage Faculty</span>
                </button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-light w-100 btn-custom text-danger border">
                    <i class="bi bi-megaphone-fill"></i>
                    <span>Department Notices</span>
                </button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-light w-100 btn-custom text-success border">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Attendance Analytics</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
